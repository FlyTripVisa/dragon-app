<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Fly Dragon AI — FlyTripVisa</title>
  <meta
    name="description"
    content="Fly Dragon AI — Your AI travel and visa assistant by FlyTripVisa."
  />

  <style>
    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --surface-soft: #f1f5f9;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --user: #2563eb;
      --assistant: #ffffff;
      --shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      height: 68px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 17px;
      background: linear-gradient(135deg, #ef4444, #2563eb);
      box-shadow: 0 7px 18px rgba(37, 99, 235, 0.2);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .new-chat-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 9px 14px;
      border-radius: 11px;
      font-weight: 650;
      transition: 0.2s ease;
    }

    .new-chat-btn:hover {
      background: var(--surface-soft);
    }

    /* =========================
       CHAT AREA
    ========================== */

    .chat-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .chat-container {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 24px;
    }

    /* =========================
       WELCOME
    ========================== */

    .welcome {
      text-align: center;
      padding: 32px 12px 30px;
    }

    .dragon-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 34px;
      font-weight: 900;
      background:
        radial-gradient(circle at 30% 20%, #60a5fa, transparent 35%),
        linear-gradient(135deg, #ef4444, #2563eb);
      box-shadow:
        0 18px 40px rgba(37, 99, 235, 0.2),
        inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -1.5px;
      line-height: 1.08;
    }

    .welcome h1 .red {
      color: #ef4444;
    }

    .welcome h1 .blue {
      color: #2563eb;
    }

    .welcome p {
      max-width: 600px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    /* =========================
       QUICK PROMPTS
    ========================== */

    .quick-prompts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 10px 0 30px;
    }

    .prompt-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .prompt-card:hover {
      transform: translateY(-2px);
      border-color: #bfdbfe;
      box-shadow: var(--shadow);
    }

    .prompt-icon {
      font-size: 20px;
      margin-bottom: 9px;
    }

    .prompt-title {
      font-size: 14px;
      font-weight: 750;
    }

    .prompt-description {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* =========================
       MESSAGES
    ========================== */

    #messages {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      animation: messageIn 0.2s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
    }

    .assistant .message-avatar {
      color: white;
      background: linear-gradient(135deg, #ef4444, #2563eb);
    }

    .user .message-avatar {
      color: white;
      background: #111827;
      order: 2;
    }

    .message-content {
      max-width: min(78%, 720px);
      border-radius: 17px;
      padding: 12px 15px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .message-content {
      background: var(--assistant);
      border: 1px solid var(--border);
    }

    .user .message-content {
      color: white;
      background: var(--user);
    }

    /* =========================
       TYPING
    ========================== */

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ca3af;
      animation: typing 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* =========================
       COMPOSER
    ========================== */

    .composer-area {
      flex-shrink: 0;
      background: linear-gradient(
        to top,
        var(--bg) 75%,
        rgba(247, 249, 252, 0)
      );
      padding: 12px 16px 18px;
    }

    .composer {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: white;
      border: 1px solid #dbe1ea;
      border-radius: 19px;
      padding: 9px 9px 9px 15px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-box:focus-within {
      border-color: #93c5fd;
      box-shadow:
        0 10px 30px rgba(15, 23, 42, 0.07),
        0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    #messageInput {
      width: 100%;
      min-height: 28px;
      max-height: 140px;
      resize: none;
      outline: none;
      border: 0;
      background: transparent;
      color: var(--text);
      line-height: 1.5;
      padding: 5px 0;
    }

    #messageInput::placeholder {
      color: #9ca3af;
    }

    #sendButton {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 0;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--primary);
      transition: 0.2s ease;
    }

    #sendButton:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    #sendButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .send-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .composer-note {
      text-align: center;
      margin-top: 8px;
      color: #9ca3af;
      font-size: 10px;
    }

    /* =========================
       EMPTY STATE
    ========================== */

    .hidden {
      display: none !important;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 640px) {
      .header {
        height: 62px;
        padding: 0 13px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      .brand-name {
        font-size: 14px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .new-chat-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .chat-container {
        width: min(100% - 20px, 920px);
        padding-top: 22px;
      }

      .welcome {
        padding: 24px 5px 22px;
      }

      .dragon-icon {
        width: 62px;
        height: 62px;
        border-radius: 19px;
        font-size: 28px;
      }

      .welcome h1 {
        font-size: 30px;
      }

      .welcome p {
        font-size: 13px;
      }

      .quick-prompts {
        gap: 8px;
      }

      .prompt-card {
        padding: 12px;
        border-radius: 14px;
      }

      .prompt-description {
        display: none;
      }

      .message-content {
        max-width: 86%;
        font-size: 13px;
      }

      .composer-area {
        padding: 8px 10px 12px;
      }

      .composer-note {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">F</div>

        <div class="brand-text">
          <div class="brand-name">Fly Dragon AI</div>
          <div class="brand-subtitle">by FlyTripVisa</div>
        </div>
      </div>

      <div class="header-actions">
        <button
          id="newChatButton"
          class="new-chat-btn"
          type="button"
          aria-label="Start a new chat"
        >
          + New Chat
        </button>
      </div>
    </header>

    <!-- CHAT -->
    <main id="chatArea" class="chat-area">
      <div class="chat-container">

        <!-- WELCOME -->
        <section id="welcome" class="welcome">
          <div class="dragon-icon">🐉</div>

          <h1>
            Welcome to
            <span class="red">Fly</span>
            <span class="blue">Dragon AI</span>
          </h1>

          <p>
            Your intelligent travel assistant for visa information,
            flights, hotels and international travel.
          </p>
        </section>

        <!-- QUICK PROMPTS -->
        <section id="quickPrompts" class="quick-prompts">

          <button
            class="prompt-card"
            type="button"
            data-prompt="Where can I travel from Bangladesh without a visa?"
          >
            <div class="prompt-icon">🌎</div>
            <div class="prompt-title">Where can I travel?</div>
            <div class="prompt-description">
              Explore visa-free and visa-on-arrival destinations.
            </div>
          </button>

          <button
            class="prompt-card"
            type="button"
            data-prompt="Tell me about the Japan tourist visa requirements."
          >
            <div class="prompt-icon">🇯🇵</div>
            <div class="prompt-title">Check Japan Visa</div>
            <div class="prompt-description">
              Learn about documents and application requirements.
            </div>
          </button>

          <button
            class="prompt-card"
            type="button"
            data-prompt="Help me find a flight for my next international trip."
          >
            <div class="prompt-icon">✈️</div>
            <div class="prompt-title">Find Flight</div>
            <div class="prompt-description">
              Get help planning your international flight.
            </div>
          </button>

          <button
            class="prompt-card"
            type="button"
            data-prompt="Help me find a suitable hotel for my trip."
          >
            <div class="prompt-icon">🏨</div>
            <div class="prompt-title">Hotel Booking</div>
            <div class="prompt-description">
              Get recommendations for your destination.
            </div>
          </button>

        </section>

        <!-- MESSAGES -->
        <section id="messages" aria-live="polite"></section>

      </div>
    </main>

    <!-- COMPOSER -->
    <footer class="composer-area">
      <div class="composer">

        <form id="chatForm" class="input-box">

          <textarea
            id="messageInput"
            rows="1"
            maxlength="8000"
            autocomplete="off"
            placeholder="Ask Fly Dragon AI anything about travel or visas..."
            aria-label="Message"
          ></textarea>

          <button
            id="sendButton"
            type="submit"
            aria-label="Send message"
          >
            <svg
              class="send-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </button>

        </form>

        <div class="composer-note">
          Fly Dragon AI can make mistakes. Verify important visa and travel information.
        </div>

      </div>
    </footer>

  </div>

  <script src="/chat.js" defer></script>
</body>
</html>
